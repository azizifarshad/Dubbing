name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Validate Build
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies (Lightweight)
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Type Check & Linting
        run: npm run lint

      - name: Security Audit (Production Dependencies)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Run Lightweight CI Test Suite (Zero Secrets Required)
        run: npm run test:ci

      - name: Build Application (Vite Frontend + Standalone Server)
        run: npm run build

      - name: Verify Build Artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/index.html")) {
            throw "Frontend build artifact missing: dist/index.html"
          }
          if (-not (Test-Path "server.cjs")) {
            throw "Backend bundle artifact missing: server.cjs"
          }
          Write-Host "Build verification passed: dist/ and server.cjs present and valid."
