name: Windows Integration & Build Validation

on:
  push:
    branches:
      - main
    paths:
      - 'launcher.cs'
      - 'installer/**'
      - 'mux_video.py'
      - 'local_whisper.py'
      - 'server.ts'
      - '.github/workflows/windows-integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'launcher.cs'
      - 'installer/**'
      - 'mux_video.py'
      - 'local_whisper.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-integration:
    name: Windows Native Validation & Launcher Compilation
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Integration Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography soundfile numpy

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend & Server Bundle
        run: npm run build

      - name: Compile Native C# Windows Launcher
        shell: pwsh
        run: |
          $cscPath = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $cscPath)) {
            $cscPath = (Get-Command csc.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Compiling launcher using: $cscPath"
          & $cscPath /target:winexe /win32icon:assets\Vidans.ico /out:DubbingVidans.exe launcher.cs
          if (-not (Test-Path "DubbingVidans.exe")) {
            throw "Failed to compile DubbingVidans.exe"
          }
          Write-Host "Successfully compiled native launcher DubbingVidans.exe"

      - name: Run Windows Native Integration Tests
        run: npm run test:integration

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          Write-Host "ISCC Path: $isccPath"
          "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV

      - name: Validate Inno Setup Installer Script Syntax
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-installer"
          & "$env:ISCC_PATH" "/DMyAppVersion=1.0.0-ci" "installer\DubbingVidans_Setup.iss"
          if (-not (Test-Path "dist-installer\Dubbing-Vidans-Setup.exe")) {
            throw "Inno Setup compilation failed or output not generated."
          }
          Write-Host "Inno Setup installer compiled and verified successfully."
