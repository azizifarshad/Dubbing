version: 2
updates:
  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 10
    reviewers:
      - "azizifarshad"
    labels:
      - "dependencies"
      - "javascript"

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:30"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    reviewers:
      - "azizifarshad"
    labels:
      - "dependencies"
      - "ci-cd"
